<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Site</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #4f46e5);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            padding: 30px;
            max-width: 600px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            margin-bottom: 25px;
            color: #e5e7eb;
        }

        .botao {
            display: inline-block;
            padding: 14px 25px;
            background: white;
            color: #4f46e5;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .botao:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Olá! 👋</h1>

        <p>
            Esse é o meu primeiro site criado pelo celular,
            usando HTML e GitHub!
        </p>

        <a class="botao" href="#">
            Meu primeiro botão
        </a>
    </div>

</body>
</html>
